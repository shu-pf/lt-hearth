<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自己成長していくアプリを開発して、日常生活のあらゆることを自動化した話</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#1a1a1a; }
.deck-viewport { position:fixed; inset:0; overflow:hidden; background:#1a1a1a; }
.deck-stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; transform-origin:0 0;
  background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%); font-family:'Space Grotesk','Zen Kaku Gothic New',sans-serif; color:#fff; }
.num { position:absolute; top:64px; left:80px; font-family:'Archivo Black',sans-serif; font-size:40px; color:rgba(255,255,255,0.9); letter-spacing:0.05em; }
.nav { position:absolute; top:72px; right:80px; font-size:22px; letter-spacing:0.12em; display:flex; gap:36px; }
.nav span { opacity:0.35; } .nav span.on { opacity:1; }
.card { position:absolute; left:80px; right:80px; bottom:80px; top:220px; background:#FF5722; border-radius:8px; padding:90px 100px;
  display:flex; flex-direction:column; justify-content:flex-end; }
.card h1 { font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:78px; line-height:1.45; color:#1a1a1a; max-width:1500px; }
.card .meta { margin-top:56px; font-size:26px; font-weight:500; color:#1a1a1a; letter-spacing:0.06em; display:flex; gap:40px; }
.grid { position:absolute; inset:0; pointer-events:none;
  background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 80px 80px; }
</style>
</head>
<body>
<div class="deck-viewport">
<main class="deck-stage" id="deckStage">
  <div class="grid"></div>
  <div class="num">01</div>
  <div class="nav"><span class="on">はじめに</span><span>アーキテクチャ</span><span>LLM Wiki</span><span>開発自動化</span></div>
  <section class="card">
    <h1>自己成長していくアプリを開発して、<br>日常生活のあらゆることを自動化した話</h1>
    <div class="meta"><span>2026/08/31</span><span>古瀬就悟</span><span>ソングLT会</span></div>
  </section>
</main>
</div>
<script>
const stage=document.getElementById('deckStage');
const scale=()=>{const f=Math.min(innerWidth/1920,innerHeight/1080);
stage.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;};
scale(); addEventListener('resize',scale);
</script>
</body>
</html>
