<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自己成長していくアプリを開発して、日常生活のあらゆることを自動化した話</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#15181c; }
.deck-viewport { position:fixed; inset:0; overflow:hidden; background:#15181c; }
.deck-stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; transform-origin:0 0;
  background:#15181c; font-family:'Noto Sans JP',sans-serif; color:#eceff2; }
.inner { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 160px; }
.rule { width:72px; height:5px; background:#4c8dff; border-radius:3px; margin-bottom:56px; }
h1 { font-size:76px; font-weight:700; line-height:1.55; max-width:1560px; }
.meta { margin-top:64px; font-size:28px; font-weight:400; color:#9aa3ad; }
.foot { position:absolute; left:160px; bottom:56px; font-size:20px; color:#5c656f; }
</style>
</head>
<body>
<div class="deck-viewport">
<main class="deck-stage" id="deckStage">
  <div class="inner">
    <div class="rule"></div>
    <h1>自己成長していくアプリを開発して、<br>日常生活のあらゆることを自動化した話</h1>
    <div class="meta">2026/08/31　古瀬就悟 / ソングLT会</div>
  </div>
  <div class="foot">1 / 15</div>
</main>
</div>
<script>
const stage=document.getElementById('deckStage');
const scale=()=>{const f=Math.min(innerWidth/1920,innerHeight/1080);
stage.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;};
scale(); addEventListener('resize',scale);
</script>
</body>
</html>
